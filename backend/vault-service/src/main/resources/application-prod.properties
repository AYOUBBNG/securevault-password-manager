# Profile: Production (Docker & Kubernetes with Environment Variables)
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://postgres:5432/securevault_vault}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}

# AES Encryption Secret
vault.aes.secret=${VAULT_AES_SECRET}
